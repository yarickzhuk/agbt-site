<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>A Game Before Time</title>
  <style>
    @font-face { font-family: 'Tektur'; src: url('assets/fonts/Tektur.ttf'); }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #000; color: #00E6FF;
      font-family: 'Tektur', monospace;
      display: flex; align-items: center; justify-content: center;
      overscroll-behavior: none;
    }
    /* html is a flex container too, so without this body shrinks to the
       game's width, and its overflow:hidden clipped the touch controls
       placed in the side bars (mobile.js placeControls) */
    body { width: 100%; }
    /* #stage-wrap holds the canvas and every touch control (js/mobile.js
       appends them as DOM siblings of #game inside it) as one unit, so one
       CSS turn turns them all. js/mobile.js's fitCanvasToViewport() sets its
       size and turn: on desktop a portrait-shaped box is turned 90deg; on a
       phone it follows how the phone is held (0/90/180/270). See mobile.js's
       file-level comment for why touch controls are plain DOM elements
       rather than PixiJS graphics. */
    /* flex-shrink:0 — as a flex item, a turned wrap (wider than the
       upright page) was squeezed to the page's width, squashing the game */
    #stage-wrap { position: relative; z-index: 1; transform-origin: center center; flex-shrink: 0; }
    /* The turn itself (0/90/180/270deg) is set inline by mobile.js's
       fitCanvasToViewport(), on #stage-wrap and #boot-status alike: on a
       phone it follows how the phone is physically held. */
    /* touch-action:none stops the browser treating joystick/button drags as
       page scroll/pinch-zoom gestures. */
    #game { display: block; width: 100%; height: 100%; box-shadow: 0 0 40px #00131a; touch-action: none; }
    /* Plain HTML/CSS, not PixiJS: this has to be visible before any JS runs
       (including the two PixiJS <script> tags below, js/vendor/, which the game itself
       depends on) so a slow network reads as "loading",
       not as a silent crash on a black canvas. js/main.js removes this node
       once assets finish loading, or repurposes it into a visible error
       message if boot throws — see its file-level boot try/catch. */
    #boot-status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'Tektur', monospace; font-size: 22px; letter-spacing: 4px;
      color: #fff; background: #000; z-index: 10; pointer-events: none;
    }
    /* Static white text, no pulsing/blink -- per direct request ("remove
       that glowing effect from loading screen", then "make it static (and
       white)"). */
    /* The load-failure screen (the author's own design, per direct request:
       "Error screen", for the game and the website alike): TECHNICAL
       DIFFICULTIES / PLEASE STAND BY beside a knocked-out Kangunroo.
       js/main.js's bootFailed() fills #boot-status from the template below. */
    #boot-status.boot-error { gap: 4vmin; flex-wrap: wrap; padding: 4vmin; }
    #boot-status .err-text { display: flex; flex-direction: column; align-items: center; gap: 9vmin; text-align: center; }
    #boot-status .err-line { font-size: clamp(18px, 4.6vmin, 40px); letter-spacing: 0.06em; }
    #boot-status .err-hint { font-size: clamp(11px, 2vmin, 16px); letter-spacing: 0.18em; color: #8a8a9a; }
    #boot-status .err-k { height: min(62vmin, 440px); width: auto; }
    /* All text is outlined, not filled, like the game's stroke-only art --
       per direct request ("make all text outlined"). The canvas text gets
       the same look from js/outline.js; this covers the HTML text: the
       loading banner, the screen border's names and the touch controls. */
    #boot-status, #screen-border, #stage-wrap div {
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1.2px currentColor;
    }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="game"></canvas>
  </div>
  <div id="boot-status">LOADING…</div>

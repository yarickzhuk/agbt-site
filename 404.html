<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<base href="/agbt-site/">
<title>A Game Before Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700&display=swap">
<style>
/* The website's "page not found" screen: the author's error-screen design
   (TECHNICAL DIFFICULTIES / PLEASE STAND BY beside a knocked-out Kangunroo),
   the same one the game shows when it can't load. */
:root { color-scheme: dark; --bg: #000; --fg: #fff; --dim: #8a8a9a; --link: #ffe400; --display: 'Tektur', ui-monospace, monospace; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); margin: 0; font-family: var(--display); }
.screen { min-height: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4vmin;
  padding-block: 4vmin; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.text { display: flex; flex-direction: column; align-items: center; gap: 9vmin; text-align: center; }
/* outlined, like every word in the game */
.line { font-size: clamp(22px, 4.6vmin, 44px); font-weight: 700; letter-spacing: .06em; color: transparent; -webkit-text-stroke: 1.3px var(--fg); }
.hint { font-size: clamp(12px, 1.8vmin, 16px); letter-spacing: .18em; color: var(--dim); }
.hint a { color: var(--link); }
.hint a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
.k { height: min(62vmin, 440px); width: auto; max-width: 100%; }
</style>
</head>
<body>
<main class="screen">
  <div class="text">
    <div class="line">TECHNICAL DIFFICULTIES</div>
    <div class="line">PLEASE STAND BY</div>
    <div class="hint">THIS PAGE DOESN'T EXIST. <a href="./">BACK TO THE HOME PAGE</a></div>
  </div>
  <img class="k" src="media/error_kangunroo.png" alt="Kangunroo, knocked out">
</main>
</body>
</html>
